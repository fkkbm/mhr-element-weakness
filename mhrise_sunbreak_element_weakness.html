:root{--bg:#0f1115;--panel:#171a21;--panel2:#202631;--text:#eef2f7;--muted:#aab4c0;--line:#303744;--accent:#f0b44d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(#0c0f14,#121720);color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}.hero{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px}h1{margin:0 0 10px;font-size:clamp(24px,4vw,38px)}.lead{margin:0;color:var(--muted);line-height:1.7}.controls{margin-top:18px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.control{background:#12161d;border:1px solid var(--line);border-radius:14px;padding:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1319;color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid var(--line);background:#151a22;color:var(--text);padding:8px 11px;border-radius:999px;cursor:pointer}.chip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.actions{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}.count,.note,.foot{color:var(--muted)}.reset{background:#232a36;color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:10px;cursor:pointer}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:800px}th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;white-space:nowrap}td{padding:13px 14px;border-bottom:1px solid #262d38}tr:hover td{background:#1a202a}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid currentColor}.fire{color:#ff876f}.water{color:#6bbcff}.i </style></head><body><div class="wrap"><section class="hero"><h1>モンスターハンターライズ：サンブレイク 属性弱点一覧</h1><p class="lead">モンスター名検索、作品区分、属性フィルター、並べ替えに対応。表の見出しクリックでも並べ替えできます。</p><div class="controls"><div class="control"><label>モンスター名で検索</label><input id="search" type="search" placeholder="例：メル・ゼナ / リオレウス / 傀異克服"></div><div class="control"><label>作品区分</label><select id="game"><option value="">すべて</option><option>ライズ</option><option>サンブレイク</option></select></div><div class="control"><label>並べ替え</label><select id="sort"><option value="name-asc">名前：昇順</option><option value="name-desc">名前：降順</option><option value="value-desc">属性肉質：高い順</option><option value="value-asc">属性肉質：低い順</option><option value="element">属性順</option><option value="game">作品区分順</option></select></div></div><div class="chips" id="chips"><button class="chip active" data-element="">すべて</button><button class="chip" data-element="火">火</button><button class="chip" data-element="水">水</button><button class="chip" data-element="氷">氷</button><button class="chip" data-element="雷">雷</button><button class="chip" data-element="龍">龍</button></div></section><div class="actions"><div id="count" class="count"></div><button id="reset" class="reset">条件をリセット</button></div><div class="table-wrap"><table><thead><tr><th data-sort="name">モンスター</th><th data-sort="game">作品</th><th data-sort="element">最有効属性</th><th data-sort="value">平均属性肉質</th><th>備考</th></tr></thead><tbody id="tbody"></tbody></table></div><p class="foot">※ 前段で整理した総合評価を収録しています。部位、怒り、泥まとい、特殊状態などによって実戦では別属性が有効になる場合があります。</p></div><script>
